# hs_calib_suite — cam_intrinsics 默认参数（对齐 Tier4 General profile）
#
# target:
#   chessboard          — squares_x/y = 内角点列/行；square_length = 方格边长 (m)
#   charuco             — squares_x/y = 方格数；square_length / marker_length (m)
#   aruco_grid          — squares_x/y = 标记列/行；marker_length；间距≈square_length-marker_length
#   aprilgrid           — Kalibr Aprilgrid：squares_x/y=tagCols/Rows，marker_length=tagSize，tag_spacing
#   circles_symmetric   — squares_x/y = 圆点列/行；square_length = 圆心距 (m)
#   circles_asymmetric  — 同上，非对称圆点阵列
#
#model: brown_conrady | kannala_brandt | cmei

squares_x: 9
squares_y: 6
square_length: 0.025
marker_length: 0.018
target: chessboard
dictionary: DICT_4X4_50
model: brown_conrady
intrinsics_profile: general
intrinsics_solver: opencv

# Tier4 chess_board_detector（YAML profile 默认多为 false）
cb_adaptive: false
cb_normalize: false
cb_fast_check: false
cb_resized_detection: false
cb_resized_max_resolution: 1000
cb_sub_pixel_refinement: true
subpix_win: 11
cb_max_lost_frames: 3
cb_padding: 120

# 采集门槛（General）
min_confidence: 0.40
min_diversity: 0.08
collector_filter_speed: true
collector_max_pixel_speed: 25.0
collector_filter_reproj: true
max_allowed_max_reprojection_error: 2.0
max_allowed_rms_reprojection_error: 0.5
# 统计图：qt=轻量摘要；matplotlib=完整 Tier4 三图（见 docs/TIER4_INTRINSICS_STATS.md）
gui.stats_backend: qt

# 数据源（GUI 选择本标定器时读入；可按现场改）
source_mode: ros_topic          # offline | ros_topic | rosbag
image_topic: /camera/color/image_raw
bag_topic: /camera/color/image_raw
camera_info_topic: /camera/color/camera_info
