#
# model: pinhole | fisheye
# dictionary: 仅 charuco / aruco_grid 使用

squares_x: 9
squares_y: 6
square_length: 0.025
marker_length: 0.018
target: chessboard
dictionary: DICT_4X4_50
model: pinhole
