[core]
reloadable = true
order = 0

[package]
version = "0.1.0"
category = "Simulation"
title = "Hs Robot Spot Factory Sim"
description = "Factory warehouse Spot or Carter cart: cmd_vel + camera/IMU/RTX lidar for obstacle mapping"
authors = ["hs"]
keywords = ["spot", "carter", "cart", "quadruped", "factory", "warehouse", "ros2", "imu", "lidar", "depth", "mapping"]
readme = "docs/README.md"

[dependencies]
"omni.kit.uiapp" = {}
"isaacsim.gui.components" = {}
# core.api / ros2.bridge / policy.examples 在 Load / Play 时按需启用

[[python.module]]
name = "hs.robot.spot_factory_sim"

[settings]
exts."hs.robot.spot_factory_sim".timeout = 5
