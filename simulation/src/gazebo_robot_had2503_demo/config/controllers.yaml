controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

    left_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    right_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    torso_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    left_gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    right_gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

diff_drive_controller:
  ros__parameters:
    left_wheel_names: ["left_wheel_joint"]
    right_wheel_names: ["right_wheel_joint"]
    wheel_separation: 0.393
    wheel_radius: 0.077
    wheels_per_side: 1
    publish_rate: 50.0
    odom_frame_id: odom
    base_frame_id: base_link
    pose_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    enable_odom_tf: true
    use_stamped_vel: false
    cmd_vel_timeout: 0.5
    open_loop: false
    position_feedback: true
    # 放开 cmd_vel 钳制（与调试 UI 上限一致）
    linear.x.has_velocity_limits: true
    linear.x.max_velocity: 5.0
    linear.x.min_velocity: -5.0
    linear.x.has_acceleration_limits: true
    linear.x.max_acceleration: 5.0
    angular.z.has_velocity_limits: true
    angular.z.max_velocity: 6.0
    angular.z.min_velocity: -6.0
    angular.z.has_acceleration_limits: true
    angular.z.max_acceleration: 8.0

left_arm_controller:
  ros__parameters:
    joints:
      - left_shoulder_pitch_joint
      - left_shoulder_roll_joint
      - left_shoulder_yaw_joint
      - left_elbow_joint
      - left_wrist_yaw_joint
      - left_wrist_pitch_joint
      - left_wrist_roll_joint
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    allow_partial_joints_goal: false
    open_loop_control: true

right_arm_controller:
  ros__parameters:
    joints:
      - right_shoulder_pitch_joint
      - right_shoulder_roll_joint
      - right_shoulder_yaw_joint
      - right_elbow_joint
      - right_wrist_yaw_joint
      - right_wrist_pitch_joint
      - right_wrist_roll_joint
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    allow_partial_joints_goal: false
    open_loop_control: true

torso_controller:
  ros__parameters:
    joints:
      - ankle_pitch_joint
      - knee_pitch_joint
      - hip_pitch_joint
      - waist_yaw_joint
      - waist_pitch_joint
      - waist_roll_joint
      - head_yaw_joint
      - head_pitch_joint
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    allow_partial_joints_goal: true
    open_loop_control: true

left_gripper_controller:
  ros__parameters:
    joints:
      - left_dex1_finger_joint_1
      - left_dex1_finger_joint_2
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    allow_partial_joints_goal: true
    open_loop_control: true

right_gripper_controller:
  ros__parameters:
    joints:
      - right_dex1_finger_joint_1
      - right_dex1_finger_joint_2
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    allow_partial_joints_goal: true
    open_loop_control: true
