controller_manager:
  ros__parameters:
    update_rate: 1000  # 与 Gazebo 仿真频率一致
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_controller:
      type: position_controllers/JointGroupPositionController

# 关节状态广播器配置
joint_state_broadcaster:
  ros__parameters:
    joints:
      - J1-1_joint
      - J1-2_joint
      - J1-3_joint
      - J1-4_joint
      - J1-5_joint
      - J1-6_joint
      - J2-1_joint
      - J2-2_joint
      - J2-3_joint
      - J2-4_joint
      - J2-5_joint
      - J2-6_joint
      - J3-1_joint
      - J3-2_joint
      - J3-3_joint
      - J3-4_joint
      - J3-5_joint
      - J3-6_joint
      - J4-1_joint
      - J4-2_joint
      - J4-3_joint
      - J4-4_joint
      - J4-5_joint
      - J4-6_joint

# 机械臂控制器配置
arm_controller:
  ros__parameters:
    joints:
      - J1-1_joint
      - J1-2_joint
      - J1-3_joint
      - J1-4_joint
      - J1-5_joint
      - J1-6_joint
      - J2-1_joint
      - J2-2_joint
      - J2-3_joint
      - J2-4_joint
      - J2-5_joint
      - J2-6_joint
      - J3-1_joint
      - J3-2_joint
      - J3-3_joint
      - J3-4_joint
      - J3-5_joint
      - J3-6_joint
      - J4-1_joint
      - J4-2_joint
      - J4-3_joint
      - J4-4_joint
      - J4-5_joint
      - J4-6_joint
    interface_name: position
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
