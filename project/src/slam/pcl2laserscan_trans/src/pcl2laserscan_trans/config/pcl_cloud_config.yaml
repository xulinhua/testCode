# pcl2laserscan_trans 配置文件

# 系统参数
system:
  log_dir: ${HOME}/ros2_logs/pcl2laserscan  # 日志目录
  
# 启动参数
launch:
  default_mode: camera_only  # 默认启动模式，可选值：camera_only, lidar_only, both
  # 话题名参数（供各节点使用）
  camera_input_topic: /camera0_depth_sensor/depth/points    # 相机输入点云话题
  camera_output_topic: /camera/cam_laser_scan_Trans # 相机输出激光扫描话题（LaserScan）
  lidar_input_topic: /lidar_pcl                    # 雷达输入点云话题（真实雷达点云来源）
  lidar_output_topic: /lidar/lidar_laserscan_Trans  # 雷达点云→激光 的输出（LaserScan）

# 相机参数
camera:
  target_frame: base_link  # 相机数据所在/输出坐标系（需与 tf.camera.child_frame 一致）
  min_height: 0.3  # 最小高度（米）
  max_height: 0.8  # 最大高度（米）
  bSaveLogInfo2Files: false  # 是否保存日志到文件
  bOutputToTerminal: true  # 是否输出到终端
  range_min: 0.1  # 最小距离（米）
  range_max: 15.0  # 最大距离（米）
  angle_min: -3.14  # 最小角度（弧度）
  angle_max: 3.14  # 最大角度（弧度）
  angle_increment: 0.0087  # 角度增量（弧度）
  voxel_leaf_size: 0.01  # 体素大小（米）
  sor_mean_k: 20  # 统计滤波均值K
  sor_stddev_mul_thresh: 0.5  # 统计滤波标准差阈值

# 激光雷达参数
# target_frame: 点云变换到此坐标系后投影为 LaserScan，输出的 LaserScan.header.frame_id 也为此 frame
lidar:
  target_frame: lidar_link  # 雷达数据所在/输出坐标系（需与 tf.lidar.child_frame 一致）
  min_height: 0.4  # 最小高度（米）
  max_height: 1.5  # 最大高度（米）
  range_min: 0.25  # 最小距离（米）
  tilt_compensation_angle: 0.07  # 倾斜补偿角度（弧度）
  tilt_axis: y  # 倾斜轴
  debug: true  # 调试模式
  filter_mean_k: 30  # 滤波均值K
  filter_stddev: 0.8  # 滤波标准差
  voxel_leaf_size: 0.1  # 体素大小（米）

# TF 变换参数（本 launch 会发布 parent_frame -> child_frame 的静态变换）
# 若仿真/驱动已发布 jetbot->camera_link、jetbot->lidar_link，请将下方 publish_*_tf 设为 false 避免重复
tf:
  publish_camera_tf: false  # 仿真已发布相机 TF 时设为 false
  publish_lidar_tf: false   # 仿真已发布雷达 TF 时设为 false
  # 相机 TF：jetbot -> camera_link（仅当 publish_camera_tf 为 true 时发布）
  camera:
    x: 0.0  # X坐标（米）
    y: 0  # Y坐标（米）
    z: 0.0  # Z坐标（米）
    roll: 0  # 滚转角（弧度）
    pitch: 0.0  # 俯仰角（弧度）
    yaw: 0  # 偏航角（弧度）ros
    parent_frame: base_link  # 底盘
    child_frame: Camera_Pseudo_Depth  # 相机 frame（与仿真一致）
  
  # 雷达 TF：jetbot -> lidar_link
  lidar:
    x: 0.0  # X坐标（米）
    y: 0.0  # Y坐标（米）
    z: 0.0  # Z坐标（米）
    roll: 0.0  # 滚转角（弧度）
    pitch: 0.0  # 俯仰角（弧度）
    yaw: 0.0  # 偏航角（弧度）
    parent_frame: base_link  # 底盘
    child_frame: lidar_link  # 雷达 frame（与仿真一致）