# OCR节点参数配置文件
#
# 配置说明:
# - camera_id: 启用的相机ID列表（全局配置）
# - 各相机的算法相关参数在各自独立的 cam_X_parameters 中配置

ros__parameters:
  # 启用相机ID列表
  camera_id: [0]

# ==================== 相机0独立配置 ====================
cam_0_parameters:
  # OCR引擎路径
  detection_engine: "install/ocr/models/v5_det_mobile.engine"
  recognition_engine: "install/ocr/models/v4_rec_mobile.engine"
  character_dict: "install/ocr/dict/ppocr_keys_v1.txt"
  # 标定模式配置
  usecalib: true

# ==================== 相机1独立配置 ====================
cam_1_parameters:
  detection_engine: "install/ocr/models/v5_det_mobile.engine"
  recognition_engine: "install/ocr/models/v4_rec_mobile.engine"
  character_dict: "install/ocr/dict/ppocr_keys_v1.txt"
  usecalib: true
