# 通用网络配置参数
# 用于DDS和UDP通信项目的统一网络参数配置

# 网络地址配置
network:
  # 服务器地址（x86主板 Ubuntu22.04 IP: 192.168.10.30）
  server_ip: "192.168.10.30"
  server_port_dds: 7400
  server_port_udp: 8888
  
  # 客户端地址（Jetson主板 Ubuntu22.04 IP: 192.168.10.61）
  client_ip: "192.168.10.61"
  client_port_dds: 7401
  client_port_udp: 8889

############################################
# DDS通信配置
############################################
dds_config:
  domain_id: 0
  participant_name: "main_participant"
  qos_profile: "default"
  
  # 主题配置
  topics:
    command_topic: "project_command"
    status_topic: "project_status"
    robot_pose_topic: "robot_pose"
    ai_coord_topic: "ai_coordinate"

  # 超时配置
  timeout:
    connection_timeout_ms: 5000
    read_timeout_ms: 1000
    write_timeout_ms: 1000

############################################
# UDP通信配置
############################################
udp_config:
  # 基本UDP配置
  buffer_size: 1024
  udp_buffer_size: 65507
  max_packet_size: 8192
  udp_port: 8888
  server_port: 8888
  client_port: 8889
  udp_blocking_mode: false
  command_max_rate: 20
  
  # 心跳配置
  heartbeat:
    interval_ms: 1000
    timeout_ms: 3000
    max_retry: 3

  # 数据重传配置
  retransmission:
    enabled: true
    max_retry: 5
    timeout_ms: 2000

  # 客户端特定配置
  bShowRunInfo: true
  log_interval: 1
  auto_start_enabled: true
  auto_start_camera: true
  auto_start_pcl2laser: true
  auto_start_detection: true
  auto_start_delay: 10.0